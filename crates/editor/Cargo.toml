[package]
name = "editor"
version = "0.1.0"
edition = "2021"
description = "Visual scene editor for insiculous_2d game engine"
authors = ["Insiculous Team"]

[dependencies]
# Internal crates
common = { path = "../common" }
ecs = { path = "../ecs" }
ui = { path = "../ui" }
input = { path = "../input" }
renderer = { path = "../renderer" }
physics = { path = "../physics" }

# External dependencies
glam = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
winit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
env_logger = { workspace = true }
tempfile = "3"
