[package]
name = "editor_integration"
version = "0.1.0"
edition = "2021"
description = "Editor integration layer for insiculous_2d - wraps Game with editor UI"

[dependencies]
# Internal crates
common = { path = "../common" }
ecs = { path = "../ecs" }
editor = { path = "../editor" }
engine_core = { path = "../engine_core" }
ui = { path = "../ui" }
input = { path = "../input" }
renderer = { path = "../renderer" }
physics = { path = "../physics" }

# External dependencies
glam = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
winit = { workspace = true }

[dev-dependencies]
# Already a workspace dependency everywhere else; needed here only so tests
# can `define_component!` game-style types for the dynamic-tier ship point.
serde = { workspace = true }
# The engine's GPU-free scene fixtures (`StubResolver`, `test_texture_path`)
# — one copy, shared with every downstream test build.
engine_core = { path = "../engine_core", features = ["test-support"] }
tempfile = "3"
