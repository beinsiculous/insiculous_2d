[package]
name = "engine_core"
version = "0.1.0"
edition = "2021"
description = "Core functionality for the insiculous_2d game engine"

[features]
default = ["physics"]
physics = ["dep:physics"]

[dependencies]
common = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
winit = { workspace = true }
gilrs = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ron = { workspace = true }
image = { workspace = true }
renderer = { path = "../renderer" }
ecs = { path = "../ecs" }
input = { path = "../input" }
physics = { path = "../physics", optional = true }
audio = { path = "../audio" }
ui = { path = "../ui" }

# pollster only blocks at the native outer edge (render_manager init);
# blocking is impossible on the browser main thread.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm-bindgen CLI must match this crate version EXACTLY — keep the `=` pin
# in sync with scripts/build_wasm.sh's version assert.
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Request",
    "Response",
    "Storage",
    "CustomEvent",
    "CustomEventInit",
    "Event",
    "EventTarget",
    "PageTransitionEvent",
] }
console_log = "1.0"
console_error_panic_hook = "0.1"

[dev-dependencies]
tempfile = "3"