[package]
name = "playground"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
editor_integration = { path = "../editor_integration" }
# The path rule Save holds a song's name to, which an imported song is held to as well.
editor = { path = "../editor" }
engine_core = { path = "../engine_core" }
common = { path = "../common" }
# The loaders an imported song, sample or SoundFont is checked by before it is written:
# `decode_sample_pcm` and the byte limits, `SongData::from_smf`, `parse_song_file` and
# `parse_sound_font` (the conductor's, so the `synth` default stays on, as `audio` has it).
audio = { path = "../audio" }
music_midi = { path = "../music_midi" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ron = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "BeforeUnloadEvent",
    "Document",
    "Element",
    "Event",
    "IdbCursor",
    "IdbCursorWithValue",
    "IdbDatabase",
    "IdbFactory",
    "IdbKeyRange",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "Location",
    "Window",
] }

[dev-dependencies]
engine_core = { path = "../engine_core", features = ["test-support"] }
ecs = { path = "../ecs" }
input = { path = "../input" }
pollster = { workspace = true }
tempfile = "3"
