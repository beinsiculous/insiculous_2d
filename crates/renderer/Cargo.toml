[package]
name = "renderer"
version = "0.1.0"
edition = "2021"
description = "WGPU renderer for the insiculous_2d game engine"

[dependencies]
common = { workspace = true }
log = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
thiserror = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Canvas lookup/adoption for the web window (see window.rs::attach_canvas).
# wasm-bindgen pin must stay in sync with engine_core's.
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "Event",
    "EventTarget",
    "MouseEvent",
    "Selection",
    "FocusOptions",
    "AddEventListenerOptions",
] }

[dev-dependencies]
pollster = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }