[package]
name = "conductor_spike"
version = "0.1.0"
edition = "2021"
description = "K1 spike: shared MIDI parts and custom instruments, native and web"
publish = false

# Not a member of the engine workspace: rustysynth and midly enter the engine only
# through crates/music_midi, and this project keeps its own lockfile as the record of
# the versions measured.
[workspace]

# cdylib = the wasm module; rlib = the native bin's normal path.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine_core = { path = "../../../crates/engine_core" }
audio = { path = "../../../crates/audio" }
common = { path = "../../../crates/common" }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
rustysynth = "1.3"
midly = "0.5"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rodio = { version = "0.20", default-features = false, features = ["symphonia-all", "wasm-bindgen"] }
# The `=` pin must match the wasm-bindgen CLI (asserted by build_wasm.sh)
# and engine_core's own pin.
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"

# Web builds: small + LTO'd, without touching the native release profile.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
strip = "debuginfo"
